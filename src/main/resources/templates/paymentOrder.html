<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Pay Order</title>
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
  <h2>Pay Order</h2>
  <div class="card mb-4" th:if="${order != null}">
    <div class="card-body">
      <h5 class="card-title">Order Details</h5>
      <p class="card-text"><strong>Order ID:</strong> <span th:text="${order.id}"></span></p>
      <p class="card-text"><strong>Author:</strong> <span th:text="${order.author}"></span></p>
      <p class="card-text"><strong>Current Status:</strong> <span th:text="${order.status}"></span></p>
    </div>
  </div>

  <form th:action="@{/order/pay/{id}(id=${order.id})}" method="post">
    <p>Click below to simulate payment processing.</p>
    <button type="submit" class="btn btn-success">Simulate Payment</button>
    <a th:href="@{/order/history}" class="btn btn-secondary">Cancel</a>
  </form>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Payment Detail</title>
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
  <h2>Payment Details</h2>
  <div class="card mb-4" th:if="${payment != null}">
    <div class="card-body">
      <h5 class="card-title">Payment Info</h5>
      <p class="card-text"><strong>Payment ID:</strong> <span th:text="${payment.id}"></span></p>
      <p class="card-text"><strong>Method:</strong> <span th:text="${payment.method}"></span></p>
      <p class="card-text"><strong>Status:</strong> <span th:text="${payment.status}"></span></p>
      <hr>
      <h5 class="card-title mt-3">Associated Order Info</h5>
      <p class="card-text"><strong>Order ID:</strong> <span th:text="${payment.order.id}"></span></p>
      <p class="card-text"><strong>Author:</strong> <span th:text="${payment.order.author}"></span></p>
      <p class="card-text"><strong>Order Status:</strong> <span th:text="${payment.order.status}"></span></p>
    </div>
  </div>
  <a th:href="@{/payment}" class="btn btn-primary">Back to Payment List</a>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Payment List</title>
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
  <h2>All Payments</h2>
  <table class="table table-striped mt-3">
    <thead>
    <tr>
      <th>Payment ID</th>
      <th>Method</th>
      <th>Status</th>
      <th>Action</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="payment : ${payments}">
      <td th:text="${payment.id}"></td>
      <td th:text="${payment.method}"></td>
      <td th:text="${payment.status}"></td>
      <td>
        <a th:href="@{/payment/{id}(id=${payment.id})}" class="btn btn-sm btn-info">View Details</a>
      </td>
    </tr>
    <tr th:if="${payments.empty}">
      <td colspan="4" class="text-center">No payments found.</td>
    </tr>
    </tbody>
  </table>
  <a th:href="@{/order/history}" class="btn btn-secondary">Back to Order History</a>
</div>
</body>
</html>
